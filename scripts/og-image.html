<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #ffffff 0%, #f9fafb 55%, #eef2f6 100%);
    position: relative;
  }
  .glow {
    position: absolute;
    top: -140px; right: -140px;
    width: 560px; height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(34,197,94,0.16), rgba(34,197,94,0) 70%);
  }
  .content {
    position: absolute;
    left: 96px; top: 0; bottom: 0;
    display: flex;
    align-items: center;
    gap: 56px;
  }
  .badge {
    flex: 0 0 auto;
    width: 176px; height: 176px;
    border-radius: 42px;
    background: #0a0f1a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 24px 48px -12px rgba(10, 15, 26, 0.4);
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 940px;
  }
  h1 {
    margin: 0;
    font-size: 84px;
    font-weight: 800;
    color: #111827;
    letter-spacing: -2.5px;
    line-height: 1;
  }
  .bar {
    width: 96px; height: 7px;
    border-radius: 4px;
    background: #22c55e;
  }
  p {
    margin: 0;
    font-size: 38px;
    font-weight: 600;
    color: #374151;
    line-height: 1.3;
  }
  .domain {
    position: absolute;
    left: 96px; bottom: 52px;
    font-size: 26px;
    font-weight: 500;
    color: #9ca3af;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="badge">
      <svg width="112" height="112" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="checkGradOg" x1="13" y1="37" x2="46" y2="6" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#39a84a" />
            <stop offset="100%" stop-color="#4ade5e" />
          </linearGradient>
        </defs>
        <path d="M 33,5 L 12,5 Q 5,5 5,12 L 5,36 Q 5,43 12,43 L 36,43 Q 43,43 43,36 L 43,22"
          stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <path d="M 13,27 L 22,37 L 46,7"
          stroke="url(#checkGradOg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </svg>
    </div>
    <div class="text">
      <h1>Promise Tracker</h1>
      <div class="bar"></div>
      <p>Never forget a customer follow-up</p>
    </div>
  </div>
  <div class="domain">promisetracker.app</div>
</body>
</html>
